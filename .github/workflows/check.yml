name: Checker

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_for_correct_installation:
    name: Check NSIS ${{ matrix.nsis-version }} on windows-${{ matrix.os-version }}
    runs-on: windows-${{ matrix.os-version }}
    strategy:
      fail-fast: false
      matrix:
        os-version: [2025, 2022]
        nsis-version: ['3.12', '3.10']
        use-cache: [true, false]
    steps:
      - uses: actions/checkout@v7

      - name: Install NSIS with EnVar plugin
        uses: ./
        with:
          nsis-version: ${{ matrix.nsis-version }}
          use-cache: ${{ matrix.use-cache }}

      - name: Check if it was correctly installed
        shell: pwsh
        run: |
          Get-Command makensis

      - name: Check that the long string patch took effect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # /HDRINFO reports the values makensis was compiled with. Without the patch
          # NSIS_MAX_STRLEN is 1024, so this also proves makensis starts.
          $info = (makensis /HDRINFO) -join "`n"
          Write-Host $info
          if ($info -notmatch 'NSIS_MAX_STRLEN\W*8192') {
              throw "makensis does not report NSIS_MAX_STRLEN 8192, so the long string patch is missing."
          }

      - name: Check that the EnVar plugin is installed and usable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Compiling the example that ships with the plugin proves makensis can resolve
          # the EnVar calls, not only that the files were copied.
          $example = "C:\Program Files (x86)\NSIS\Examples\EnVar\example.nsi"
          Copy-Item -Path $example -Destination $env:RUNNER_TEMP
          makensis (Join-Path $env:RUNNER_TEMP 'example.nsi')
          if ($LASTEXITCODE -ne 0) {
              throw "Compiling the EnVar example failed with exit code $LASTEXITCODE."
          }
