name: Floating-Tags

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag the floating tags should point at, for example v1.2.1'
        required: true

permissions:
  contents: write

jobs:
  update_floating_tags:
    name: Update the major and major.minor tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Move the floating tags to the release commit
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "$RELEASE_TAG is not a vMAJOR.MINOR.PATCH tag. Nothing to do."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          commit=$(git rev-list --max-count=1 "$RELEASE_TAG")
          echo "$RELEASE_TAG points at $commit."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tag in "$major" "$minor"; do
            git tag --force --annotate "$tag" \
              --message "Latest $tag release ($RELEASE_TAG)" "$commit"
            git push --force origin "refs/tags/$tag"
            echo "$tag now points at $commit."
          done
